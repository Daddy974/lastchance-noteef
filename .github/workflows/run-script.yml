name: Run OneSignal script

on:
  schedule:
    - cron: "0 9 27,28 * *"
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # ou "22" recommandé

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: test-push-Iphone.js
